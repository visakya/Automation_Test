appId: com.miwayz.driversapp.qa

---
# MiWayz Driver - Full trip flow (STARTER TEMPLATE)
# Start this flow first so the driver is ready to receive the passenger booking.
# The coordinator starts the passenger flow only after this request wait begins.
# Replace app ID, test PIN, and selectors with actual QA app values.

- launchApp
- waitForAnimationToEnd

# Driver must be online before a passenger requests a trip.
- runFlow:
    when:
      visible: "Go Online"
    commands:
      - tapOn: "Go Online"
      - waitForAnimationToEnd

# Wait for an incoming trip request
- extendedWaitUntil:
    visible: "Accept Ride"
    timeout: 180000

# Accept request
- tapOn: "Accept Ride"
- waitForAnimationToEnd

# Navigation to pickup may open another app; adapt to your test environment.
# - tapOn: "Navigate"

# Start the trip by swiping the slider from left to right
- extendedWaitUntil:
    visible: "Start Trip"
    timeout: 120000
- swipe:
    start: 15%, 90%
    end: 85%, 90%
    duration: 500
- waitForAnimationToEnd

# Enter the PIN read from the passenger device by the test runner.
# Start the flow with RIDE_START_PIN set to the current passenger PIN.
- extendedWaitUntil:
    visible: "Ride Start PIN"
    timeout: 120000
- inputText: "${RIDE_START_PIN}"
- waitForAnimationToEnd

# Verify the trip is active, then wait until the destination/drop-off state
# is displayed. The driver must follow the route physically or through the
# navigation system; Maestro cannot simulate vehicle movement or GPS.
- extendedWaitUntil:
    visible: ".*(In Trip|Dropping off).*"
    timeout: 30000
# End the ride only after reaching the drop-off location. "Dropping off" is
# shown for the whole trip, so wait for the end-ride slider instead.
- extendedWaitUntil:
    visible: "Slide to End ride"
    timeout: 1800000
- swipe:
    start: 15%, 90%
    end: 85%, 90%
    duration: 500
- waitForAnimationToEnd

# Collect the cash fare after reaching the drop-off location
- extendedWaitUntil:
    visible: "Collect Cash"
    timeout: 60000
- swipe:
    start: 15%, 90%
    end: 85%, 90%
    duration: 500
- waitForAnimationToEnd

# Submit the passenger rating.
- extendedWaitUntil:
    visible: "Rate Rider"
    timeout: 30000
- tapOn: "Rate Rider"
- waitForAnimationToEnd
