
appId: com.miwayz.customer_app.qa
---
# Step 1: Launch passenger app
- launchApp

# Step 1a: Skip a leftover "Rate your driver" screen from a previous trip
- extendedWaitUntil:
    visible: ".*(Where to\\?|Rate your driver).*"
    timeout: 15000
- runFlow:
    when:
      visible: ".*Rate your driver.*"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd

# Step 2: Wait for home screen
- extendedWaitUntil:
    visible: "Where to?"
    timeout: 15000

# Step 3: Open ride planning
- tapOn: "Where to?"

# Step 4: Verify ride planning screen
- extendedWaitUntil:
    visible: "Plan Your ride"
    timeout: 10000

# Step 4a: Set the pickup to Miwayz Lanka (Pvt) Ltd
- tapOn: "Current Location"
- waitForAnimationToEnd
# The field clears "Current Location" after the first keystroke and drops
# that character, so type once, clear it, and type again.
- inputText: "Miwayz Lanka"
- eraseText: 30
- inputText: "Miwayz Lanka"
- extendedWaitUntil:
    visible: ".*Miwayz Lanka.*Castle Lane.*"
    timeout: 15000
- tapOn: ".*Miwayz Lanka.*Castle Lane.*"
- waitForAnimationToEnd

# Step 5: Tap destination field
- tapOn: "Where are you going?"

# Step 6: Enter destination
- inputText: "Pettah"

# Step 7: Wait for suggestions
- extendedWaitUntil:
    visible: "Pettah CTB bus stand"
    timeout: 15000

# Step 8: Select destination
- tapOn: "Pettah CTB bus stand"

# Step 9: Wait for ride selection screen
- extendedWaitUntil:
    visible: "Choose your ride"
    timeout: 20000

# Step 10: Verify Mini is selected
- assertVisible: "Confirm Mini"

# Step 11: Confirm Mini
- tapOn: "Confirm Mini"

# Step 12: Wait for pickup confirmation
- extendedWaitUntil:
    visible: "Confirm pick-up"
    timeout: 15000

# Step 13: Confirm pickup
- tapOn: "Confirm pick-up"

# Step 14: Allow the request state to update.
# The driver may accept immediately, so the passenger can leave Searching
# before a text assertion is evaluated. The coordinator confirms the booking
# by reading the ride-start PIN from this device.
- waitForAnimationToEnd
